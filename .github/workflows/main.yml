
name: Build Basefinder

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build mod
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Basefinder-JAR
          path: build/libs/*.jar
